name: Deploy Minecraft Server

defaults:
  run:
    working-directory: mc-deploy

on:
  workflow_dispatch:
    inputs:
      server_name:
        description: 'Server name (letters, numbers, hyphens). Reusing a destroyed server''s name brings its world back.'
        required: true
        type: string
      edition:
        description: 'Edition'
        type: choice
        options: [java, bedrock]
        default: java
      type:
        description: 'Server type (Java only). "modrinth" = a Modrinth modpack, set it below.'
        type: choice
        options: [vanilla, paper, purpur, fabric, forge, neoforge, quilt, modrinth]
        default: vanilla
      mc_version:
        description: 'Minecraft version, e.g. 1.21.1, or "latest"'
        required: true
        default: latest
        type: string
      mods:
        description: 'Mods/plugins, comma-separated: jar URLs and/or Modrinth project names (e.g. lithium,sodium)'
        required: false
        type: string
      modpack:
        description: 'Modrinth modpack slug or URL (only for type "modrinth")'
        required: false
        type: string
      memory:
        description: 'Memory for the server, e.g. 4G'
        default: 4G
        type: string
      world_size:
        description: 'World storage, e.g. 10Gi (ignored when reusing a kept world)'
        default: 10Gi
        type: string
      public:
        description: 'Open it to the internet (router port forward)'
        type: boolean
        default: true

concurrency:
  group: minecraft
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, homelab-k8s]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Deploy server
        env:
          SERVER_NAME: ${{ inputs.server_name }}
          EDITION: ${{ inputs.edition }}
          TYPE: ${{ inputs.type }}
          MC_VERSION: ${{ inputs.mc_version }}
          MODS: ${{ inputs.mods }}
          MODPACK: ${{ inputs.modpack }}
          MEMORY: ${{ inputs.memory }}
          WORLD_SIZE: ${{ inputs.world_size }}
          PUBLIC: ${{ inputs.public }}
        run: bash ./scripts/deploy-minecraft.sh
