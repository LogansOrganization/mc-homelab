name: Deploy Minecraft Server

defaults:
  run:
    working-directory: mc-deploy

on:
  workflow_dispatch:
    inputs:
      server_name:
        description: 'Server name (lowercase letters/numbers/hyphens only, used to identify it later for teardown)'
        required: true
        type: string
      mc_version:
        description: 'Minecraft version (e.g. 1.21.1, or "latest")'
        required: true
        default: 'latest'
        type: string
      mod_loader:
        description: 'Mod loader'
        required: true
        type: choice
        options:
          - vanilla
          - paper
          - forge
          - fabric
          - quilt
        default: vanilla
      mods:
        description: 'Comma-separated URLs to mod/plugin jars (leave blank for none, ignored for vanilla)'
        required: false
        type: string
      world_size:
        description: 'World storage size'
        required: false
        default: '10Gi'
        type: string
      memory:
        description: 'Memory allocated to the server (e.g. 4G)'
        required: false
        default: '4G'
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure in-cluster kubectl access
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
          fi
          command -v envsubst >/dev/null 2>&1 || (apt-get update && apt-get install -y gettext-base)
          kubectl config set-cluster in-cluster --server=https://kubernetes.default.svc --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kubectl config set-credentials sa --token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          kubectl config set-context in-cluster --cluster=in-cluster --user=sa --namespace=default
          kubectl config use-context in-cluster

      - name: Deploy server
        env:
          SERVER_NAME: ${{ inputs.server_name }}
          MC_VERSION: ${{ inputs.mc_version }}
          MOD_LOADER: ${{ inputs.mod_loader }}
          MODS: ${{ inputs.mods }}
          WORLD_SIZE: ${{ inputs.world_size }}
          MEMORY: ${{ inputs.memory }}
        run: |
          chmod +x ./scripts/deploy-minecraft.sh
          ./scripts/deploy-minecraft.sh | tee "$GITHUB_STEP_SUMMARY"
