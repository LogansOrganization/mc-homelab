name: Sync Cloudflare token
run-name: "sync cloudflare token"

# Copies the org secret CLOUDFLARE_API_TOKEN (Edit zone DNS, solarnebulae.com only) into the
# cluster for the home IP updater (dns), HTTPS certificates (cert-manager) and Minecraft DNS
# names (github-runner). Lives here because org secrets only reach org repos. Re-run it after
# replacing the token.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: [self-hosted, homelab-k8s]
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Token into the cluster
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::Org secret CLOUDFLARE_API_TOKEN is empty or not shared with this repo."; exit 1; }
          kubectl create namespace dns --dry-run=client -o yaml | kubectl apply -f -
          for ns in dns cert-manager github-runner; do
            kubectl create secret generic cloudflare-api-token -n "$ns" --from-literal=token="$CF_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
          done
          kubectl rollout restart deploy/cloudflare-ddns -n dns 2>/dev/null || true
