name: Destroy Minecraft Server
run-name: "destroy ${{ inputs.server_name }}${{ inputs.delete_world && ' (and its world)' || '' }}"

defaults:
  run:
    working-directory: mc-deploy

on:
  workflow_dispatch:
    inputs:
      server_name:
        description: 'Server name to tear down'
        required: true
        type: string
      delete_world:
        description: 'Also delete the world for good (otherwise it is kept for next time)'
        type: boolean
        default: false

concurrency:
  group: minecraft-${{ inputs.server_name }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: [self-hosted, homelab-k8s]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Destroy server
        env:
          SERVER_NAME: ${{ inputs.server_name }}
          DELETE_WORLD: ${{ inputs.delete_world }}
        run: bash ./scripts/destroy-minecraft.sh
