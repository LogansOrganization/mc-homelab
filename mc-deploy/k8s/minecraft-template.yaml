apiVersion: v1
kind: Namespace
metadata:
  name: mc-${SERVER_NAME}
  labels:
    app: minecraft
    mc-slot: "${SLOT_NUMBER}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: world-data
  namespace: mc-${SERVER_NAME}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: ${WORLD_SIZE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: mc-${SERVER_NAME}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          env:
            - name: EULA
              value: "TRUE"
            - name: VERSION
              value: "${MC_VERSION}"
            - name: TYPE
              value: "${MOD_LOADER_UPPER}"
            - name: MEMORY
              value: "${MEMORY}"
            - name: ${MOD_ENV_NAME}
              value: "${MODS}"
          ports:
            - containerPort: 25565
              name: minecraft
          volumeMounts:
            - name: world
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: "${MEMORY}"
            limits:
              cpu: "4"
              memory: "${MEMORY_LIMIT}"
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: world
          persistentVolumeClaim:
            claimName: world-data
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: mc-${SERVER_NAME}
spec:
  type: LoadBalancer
  loadBalancerIP: ${LB_IP}
  selector:
    app: minecraft
  ports:
    - port: 25565
      targetPort: 25565
      protocol: TCP
