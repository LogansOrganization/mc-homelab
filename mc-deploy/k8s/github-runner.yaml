apiVersion: v1
kind: Namespace
metadata:
  name: github-runner
---
apiVersion: v1
kind: Secret
metadata:
  name: github-runner-secret
  namespace: github-runner
type: Opaque
stringData:
  # A GitHub Personal Access Token (classic) with 'repo' scope, OR a fine-grained
  # token scoped to just this repo with Administration:Read&Write permission
  # (needed to register/deregister the runner). Generate at:
  # https://github.com/settings/tokens
  ACCESS_TOKEN: "REPLACE_ME_WITH_YOUR_GITHUB_PAT"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner
  namespace: github-runner
---
# Scoped permissions: the runner can fully manage namespaces labeled app=minecraft,
# and can create/delete namespaces in general (needed since it creates NEW mc-* namespaces
# that don't have the label yet at creation time). It does NOT get access to anything
# outside of what it needs to run this workflow.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: github-runner-minecraft-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-runner-minecraft-manager
subjects:
  - kind: ServiceAccount
    name: github-runner
    namespace: github-runner
roleRef:
  kind: ClusterRole
  name: github-runner-minecraft-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: github-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: github-runner
      containers:
        - name: runner
          image: myoung34/github-runner:latest
          env:
            - name: REPO_URL
              value: "REPLACE_ME_https://github.com/yourusername/your-repo"
            - name: RUNNER_NAME
              value: "homelab-runner"
            - name: RUNNER_WORKDIR
              value: "/tmp/runner-work"
            - name: RUNNER_SCOPE
              value: "repo"
            - name: LABELS
              value: "self-hosted"
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: ACCESS_TOKEN
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
